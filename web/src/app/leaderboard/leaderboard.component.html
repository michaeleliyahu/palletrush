<h2>Heat {{ heatId() }} leaderboard</h2>
<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>Driver</th>
      <th>Team</th>
      <th>Raw time</th>
    </tr>
  </thead>
  <tbody>
    @for (entry of entries(); track entry.runId) {
      <tr>
        <td>{{ entry.rank }}</td>
        <td>{{ entry.driverName }}</td>
        <td>{{ entry.teamName }}</td>
        <td>{{ entry.rawTimeMs | runTime }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No finished runs yet.</td>
      </tr>
    }
  </tbody>
</table>
