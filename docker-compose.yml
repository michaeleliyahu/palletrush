services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: league
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d league"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.11
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  telemetry-api:
    build:
      context: .
      dockerfile: src/Telemetry.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5200"
      ConnectionStrings__Telemetry: Host=postgres;Port=5432;Database=telemetry;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5200:5200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  league-api:
    profiles: [full]
    build:
      context: .
      dockerfile: src/League.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5100"
      ConnectionStrings__League: Host=postgres;Port=5432;Database=league;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: http://league-api:5100
      TELEMETRY_URL: http://telemetry-api:5200
    ports:
      - "4200:4200"
    depends_on:
      - league-api
      - telemetry-api
